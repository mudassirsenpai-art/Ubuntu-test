name: Remote Ubuntu 22.04 Setup (yomiserver.ggff.net)

on:
  workflow_dispatch:

jobs:
  remote-ubuntu:
    runs-on: ubuntu-22.04 # Strict Ubuntu 22.04 LTS
    timeout-minutes: 360 # 6 Hours Limit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Root Password
        run: |
          set -e
          echo "root:root" | sudo chpasswd

          # Don't rely on matching existing lines with sed (fails silently if the
          # line doesn't exist in this exact form). Force the values instead.
          sudo sed -i '/^PermitRootLogin/d; /^#PermitRootLogin/d' /etc/ssh/sshd_config
          sudo sed -i '/^PasswordAuthentication/d; /^#PasswordAuthentication/d' /etc/ssh/sshd_config
          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config

          # Ubuntu 22.04 often has an Include for /etc/ssh/sshd_config.d/*.conf
          # which can silently override the above. Neutralize any conflicting
          # drop-in files (e.g. 50-cloud-init.conf disables password auth).
          if [ -d /etc/ssh/sshd_config.d ]; then
            sudo sed -i '/^PermitRootLogin/d; /^PasswordAuthentication/d' /etc/ssh/sshd_config.d/*.conf 2>/dev/null || true
          fi

          # Make sure sshd is actually installed/enabled (some runner images
          # ship it stopped or masked).
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          sudo systemctl enable ssh
          sudo systemctl restart ssh

          echo "---- Effective sshd config (verifying it actually applied) ----"
          sudo sshd -T | grep -Ei 'permitrootlogin|passwordauthentication'
          echo "---- sshd service status ----"
          sudo systemctl status ssh --no-pager | head -10

      - name: Pre-install Node.js, Git, Zip, and Claude Code
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip curl jq
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo npm install -g @anthropic-ai/claude-code

      - name: Verify SSH Works Locally (before exposing via ngrok)
        run: |
          set -e
          sudo apt-get install -y sshpass
          echo "Testing local SSH login as root..."
          sshpass -p 'root' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@localhost "echo LOCAL_SSH_OK"
          echo "If you see LOCAL_SSH_OK above, sshd itself is fine and the issue (if any) is ngrok-side."

      - name: Install Cloudflared & Setup Tunnel
        env:
          TUNNEL_UUID: ${{ secrets.TUNNEL_UUID }}
          TUNNEL_CREDENTIALS: ${{ secrets.TUNNEL_CREDENTIALS }}
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          sudo mkdir -p /root/.cloudflared
          echo "$TUNNEL_CREDENTIALS" | base64 -d | sudo tee /root/.cloudflared/$TUNNEL_UUID.json > /dev/null

          # Tunnel routing to Port 2053 for 3X-UI Panel
          sudo bash -c "cat <<EOF > /root/.cloudflared/config.yml
          tunnel: $TUNNEL_UUID
          credentials-file: /root/.cloudflared/$TUNNEL_UUID.json

          ingress:
            - hostname: yomiserver.ggff.net
              service: http://localhost:2053
            - service: http_status:404
          EOF"

          sudo cloudflared tunnel --config /root/.cloudflared/config.yml run &
          echo "Cloudflare Tunnel active on yomiserver.ggff.net"

      - name: Install & Start Ngrok SSH Tunnel
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          set -e

          if [ -z "$NGROK_TOKEN" ]; then
            echo "!!! ERROR: NGROK_AUTH_TOKEN secret is empty or not set."
            echo "!!! Go to repo Settings -> Secrets and Variables -> Actions and add it."
            exit 1
          fi

          # Install ngrok
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update
          sudo apt install ngrok -y

          # Configure authtoken
          ngrok config add-authtoken "$NGROK_TOKEN"

          # Start ngrok in background, fully detached, logging to file
          nohup ngrok tcp 22 --log=stdout --log-format=logfmt > ngrok.log 2>&1 &
          NGROK_PID=$!
          echo "Ngrok started with PID $NGROK_PID"

          # Poll the local ngrok API until the tunnel is actually up
          TUNNEL_URL=""
          for i in $(seq 1 20); do
            sleep 2
            RESPONSE=$(curl -s http://localhost:4040/api/tunnels || true)

            if [ -n "$RESPONSE" ]; then
              TUNNEL_URL=$(echo "$RESPONSE" | jq -r '.tunnels[]? | select(.proto=="tcp") | .public_url' 2>/dev/null | head -1)
            fi

            if [ -n "$TUNNEL_URL" ] && [ "$TUNNEL_URL" != "null" ]; then
              break
            fi
            echo "Waiting for ngrok tunnel... attempt $i/20"
          done

          if [ -z "$TUNNEL_URL" ] || [ "$TUNNEL_URL" == "null" ]; then
            echo "!!! Ngrok tunnel FAILED to start within timeout."
            echo "!!! ---- ngrok.log dump ----"
            cat ngrok.log
            echo "!!! -------------------------"
            echo "!!! Common causes: invalid authtoken, unverified ngrok account (email/phone needed for TCP tunnels), or ngrok account already has a tunnel running elsewhere on the free plan."
            exit 1
          fi

          # TUNNEL_URL looks like tcp://0.tcp.ngrok.io:12345
          HOST_PORT=$(echo "$TUNNEL_URL" | sed 's#tcp://##')
          HOST=$(echo "$HOST_PORT" | cut -d: -f1)
          PORT=$(echo "$HOST_PORT" | cut -d: -f2)

          echo "============================================="
          echo " NGROK SSH TUNNEL IS LIVE"
          echo "============================================="
          echo " Raw URL   : $TUNNEL_URL"
          echo " Host      : $HOST"
          echo " Port      : $PORT"
          echo ""
          echo " Connect from Termux with:"
          echo "   ssh root@$HOST -p $PORT"
          echo ""
          echo " Password  : root"
          echo "============================================="
          echo ""
          echo " ngrok account/region info from API:"
          curl -s http://localhost:4040/api/tunnels | jq '.'
          echo ""
          echo " Full ngrok.log so far:"
          cat ngrok.log

      - name: Live-tail ngrok log for 3 minutes (watch this while you try connecting from Termux NOW)
        run: |
          echo "You have 3 minutes. Try 'ssh root@<host> -p <port>' from Termux RIGHT NOW."
          echo "Any connection attempt/error will appear below in real time:"
          timeout 180 tail -f ngrok.log || true

      - name: Keep Session Alive for 6 Hours
        run: sleep 21600
