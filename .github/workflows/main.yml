name: Remote Ubuntu 22.04 Setup (yomiserver.ggff.net)

on:
  workflow_dispatch:

jobs:
  remote-ubuntu:
    runs-on: ubuntu-22.04 # Strict Ubuntu 22.04 LTS
    timeout-minutes: 360 # 6 Hours Limit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Root Password
        run: |
          echo "root:root" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Pre-install Node.js, Git, Zip, and Claude Code
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo npm install -g @anthropic-ai/claude-code

      - name: Install Cloudflared & Setup Tunnel
        env:
          TUNNEL_UUID: ${{ secrets.TUNNEL_UUID }}
          TUNNEL_CREDENTIALS: ${{ secrets.TUNNEL_CREDENTIALS }}
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          sudo mkdir -p /root/.cloudflared
          echo "$TUNNEL_CREDENTIALS" | base64 -d | sudo tee /root/.cloudflared/$TUNNEL_UUID.json > /dev/null

          # Tunnel routing to Port 2053 for 3X-UI Panel
          sudo bash -c "cat <<EOF > /root/.cloudflared/config.yml
          tunnel: $TUNNEL_UUID
          credentials-file: /root/.cloudflared/$TUNNEL_UUID.json

          ingress:
            - hostname: yomiserver.ggff.net
              service: http://localhost:2053
            - service: http_status:404
          EOF"

          sudo cloudflared tunnel --config /root/.cloudflared/config.yml run &
          echo "Cloudflare Tunnel active on yomiserver.ggff.net"

      - name: Install & Start Ngrok SSH Tunnel
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          ngrok config add-authtoken $NGROK_TOKEN
          ngrok tcp 22 --log=stdout > ngrok.log &
          sleep 5
          echo "============================================="
          echo "CONNECT TO SSH VIA NGROK:"
          curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'
          echo "============================================="

      - name: Keep Session Alive for 6 Hours
        run: sleep 21600
