name: Remote Ubuntu 6-Hour Session with Pre-installed Claude Code

on:
  workflow_dispatch:

jobs:
  remote-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Max free tier limit (6 Hours)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set root password to 'root'
        run: |
          echo "root:root" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Pre-install Node.js, Git, Zip, and Claude Code
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo npm install -g @anthropic-ai/claude-code

      - name: Install & Start Ngrok SSH Tunnel
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          ngrok config add-authtoken $NGROK_TOKEN
          ngrok tcp 22 --log=stdout > ngrok.log &
          sleep 5
          echo "============================================="
          echo "CONNECT TO SSH:"
          curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'
          echo "============================================="

      - name: Keep Session Alive for 6 Hours
        run: sleep 21600
